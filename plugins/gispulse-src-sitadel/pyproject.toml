[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gispulse-src-sitadel"
version = "0.1.0"
description = "Sitadel urban planning authorisations source for GISPulse (SDES/MTES)"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
authors = [{ name = "GISPulse", email = "dev@gispulse.io" }]
dependencies = [
    "gispulse>=2.0.0,<3.0.0",
]

# Registered as a data source - discovered by core.plugin_hub.PluginHub.
[project.entry-points."gispulse.data_sources"]
sitadel = "gispulse_src_sitadel:register"

[tool.gispulse.plugin]
kind = "source"
protocol = ">=1.0,<2.0"
domain = "foncier"
jurisdiction = "FR"
display_name = "Sitadel - Autorisations d'urbanisme (permis de construire, France)"
